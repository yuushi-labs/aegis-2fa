      <div style="max-width: 40rem; margin: 3rem auto; padding: 0 1.5rem; font-family: system-ui, sans-serif; line-height: 1.8; color: #22262a;">
        <h1 style="font-size: 1.5rem;">Zekey 2FA — ゼロ知識E2EEの2段階認証アプリ</h1>
        <p>
          この画面を操作するには JavaScript が必要です。Zekey 2FA は、TOTP / HOTP の認証コードを発行する無料の2段階認証（2FA）アプリで、
          秘密鍵はブラウザの中だけで復号され、サーバーには暗号文しか置かれません（ゼロ知識 E2EE）。
        </p>
        <h2 style="font-size: 1.1rem;">主な特徴</h2>
        <ul>
          <li>ゼロ知識 E2EE: PBKDF2-HMAC-SHA-256（60万回）＋ AES-256-GCM。マスターパスワードと秘密鍵は端末の外へ出ません。</li>
          <li>TOTP / HOTP 対応: 6桁・8桁のコード発行と残り時間の表示。</li>
          <li>パスキー・セキュリティキー（WebAuthn PRF）での解錠。指紋・顔・PIN で開けられます。</li>
          <li>Google Authenticator からの移行（otpauth-migration:// の QR 読み取り）。</li>
          <li>Android アプリとの暗号化同期、複数端末・複数ボルト、30日ゴミ箱、暗号化バックアップ。</li>
          <li>プライバシー保護: 解析タグ・広告・外部送信はなく、Referrer も送りません。<a href="__PRIVACY_URL__">プライバシーポリシー</a></li>
        </ul>
        <p>JavaScript を有効にすると、このままボルトを作成して使い始められます。</p>
