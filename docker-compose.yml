services:
  zekey:
    build: .
    image: zekey-2fa:local
    container_name: zekey-2fa
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATABASE_PATH: /data/zekey.db
      # TLS 終端のリバースプロキシ配下で動かす場合:
      # TRUST_PROXY: "true"
      # ZEKEY_HTTPS: "true"
    volumes:
      - zekey-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  zekey-data:
