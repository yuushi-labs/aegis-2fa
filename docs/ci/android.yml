name: Android

# Android アプリの Unit テスト・Lint・ビルド。CI（ci.yml）から呼び出し、
# release.yml からは署名付き APK のビルドに使う。
on:
  workflow_call:
    inputs:
      upload-artifact:
        description: 'ビルドした APK を成果物にする'
        type: boolean
        default: false

# CI からも Release からも呼ばれるため、呼び出し元のワークフロー名もグループに入れる
# （同じ ref で互いの実行を取り消さない）。
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'

jobs:
  build:
    name: android unit test / lint / assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 署名鍵はリポジトリの keystore/ にある固定鍵を使う（Secrets があればそちらを優先）。
      # `if:` は secrets を直接参照できないので、環境変数に落としてから判定する。
      # パスワードはシェルに再展開されないよう、引用した変数からそのまま書き出す。
      - name: Decode signing keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "署名鍵の Secret は未設定。リポジトリの固定鍵（android/keystore/）で署名します。"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aegis-release.jks"
          { echo "AEGIS_KEYSTORE_PATH=$RUNNER_TEMP/aegis-release.jks"; } >> "$GITHUB_ENV"
          { echo "AEGIS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"; } >> "$GITHUB_ENV"
          { echo "AEGIS_KEY_ALIAS=$KEY_ALIAS"; } >> "$GITHUB_ENV"
          { echo "AEGIS_KEY_PASSWORD=$KEY_PASSWORD"; } >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Assemble debug + release APK
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verify the release APK is signed and installable
        if: ${{ inputs.upload-artifact }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | tee apk-signature.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission)"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload APK
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@v7
        with:
          name: aegis-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
